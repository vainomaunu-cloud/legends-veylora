<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Legends Veylora</title>
<style>
  html, body { margin: 0; height: 100%; background: #14141c; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center;
         font-family: system-ui, sans-serif; color: #9aa3b5; }
  canvas { image-rendering: crisp-edges; image-rendering: pixelated; background: #000;
           box-shadow: 0 0 0 4px #2a2a38; }
  #help { margin-top: 14px; font-size: 13px; }
  kbd { background: #2a2a38; color: #dde; border-radius: 3px; padding: 1px 5px; font-size: 12px; }
  #error { color: #ff8080; white-space: pre-wrap; max-width: 640px; }

  /* save button */
  #saveBar { margin-top: 12px; display: flex; align-items: center; gap: 10px; font-size: 13px; min-height: 34px; }
  #saveBtn { font: 600 14px system-ui, sans-serif; color: #fff; background: #2f8a3a; border: 2px solid #5cc46a;
             border-radius: 8px; padding: 6px 14px; cursor: pointer; touch-action: manipulation; }
  #saveBtn:hover, #invBtn:hover { filter: brightness(1.15); }
  #invBtn { font: 600 14px system-ui, sans-serif; color: #fff; background: #8a5a2c; border: 2px solid #c68a4a;
            border-radius: 8px; padding: 6px 14px; cursor: pointer; touch-action: manipulation; }
  #invBtn:active { transform: scale(0.96); }
  body.touch:not(.portrait) #saveBar button { width: 130px; }
  #saveBtn:active { transform: scale(0.96); }
  #saveMsg.bad { color: #ff9a8a; }
  body.touch.portrait #saveBar { margin-top: 14px; }
  body.touch:not(.portrait) #saveBar { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right));
                                      margin: 0; flex-direction: column; align-items: flex-end; gap: 4px; max-width: 170px; }
  body.touch:not(.portrait) #saveMsg { text-align: right; font-size: 12px; }

  /* ---------- on-screen controls (phones and tablets) ---------- */
  #touch { display: none; }
  body.touch { touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none;
               -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overflow: hidden; }
  body.touch #help { display: none; }
  body.touch #touch { display: block; }
  body.touch.portrait { justify-content: flex-start; padding-top: max(12px, env(safe-area-inset-top)); box-sizing: border-box; }

  .pad { position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); touch-action: none; }
  #dpad { left: max(16px, env(safe-area-inset-left)); width: 150px; height: 150px; }
  #dpad div { position: absolute; background: #2e3346; border: 2px solid #4a5170; border-radius: 10px;
              width: 48px; height: 48px; box-sizing: border-box; }
  #dpad .up { left: 51px; top: 0; } #dpad .down { left: 51px; bottom: 0; }
  #dpad .left { left: 0; top: 51px; } #dpad .right { right: 0; top: 51px; }
  #dpad .mid { left: 51px; top: 51px; background: #262a3a; border-color: #262a3a; }
  #dpad div.on { background: #5a6488; }
  #dpad .up::after, #dpad .down::after, #dpad .left::after, #dpad .right::after {
    content: ''; position: absolute; left: 50%; top: 50%; border: 9px solid transparent; transform: translate(-50%, -50%); }
  #dpad .up::after { border-bottom-color: #c8cee0; margin-top: -4px; }
  #dpad .down::after { border-top-color: #c8cee0; margin-top: 4px; }
  #dpad .left::after { border-right-color: #c8cee0; margin-left: -4px; }
  #dpad .right::after { border-left-color: #c8cee0; margin-left: 4px; }

  #buttons { right: max(16px, env(safe-area-inset-right)); width: 170px; height: 150px; }
  .btn { position: absolute; border-radius: 50%; display: flex; align-items: center; justify-content: center;
         font-weight: 700; color: #fff; box-sizing: border-box; touch-action: none; }
  .btn.on { filter: brightness(1.35); transform: scale(0.94); }
  #btnA { right: 0; top: 18px; width: 72px; height: 72px; background: #d8443a; border: 3px solid #f08a80; font-size: 26px; }
  #btnB { right: 82px; top: 62px; width: 62px; height: 62px; background: #3a6ad8; border: 3px solid #8aa8f0; font-size: 22px; }
  #btnF { right: 92px; top: 0; width: 46px; height: 46px; background: #2e8a7a; border: 2px solid #6cc8b8; font-size: 13px; }
  #btnM { right: 10px; top: 104px; width: 44px; height: 44px; background: #4a4f66; border: 2px solid #7a809a; font-size: 18px; }
</style>
</head>
<body>
<canvas id="game" width="240" height="160"></canvas>
<div id="saveBar"><button id="saveBtn" type="button">💾 Tallenna</button><button id="invBtn" type="button">🎒 Reppu</button><span id="saveMsg"></span></div>
<div id="help"><kbd>Nuolet</kbd> / <kbd>WASD</kbd> liiku · <kbd>Z</kbd> / <kbd>Enter</kbd> OK · <kbd>X</kbd> / <kbd>Esc</kbd> takaisin · <kbd>F</kbd> kalasta · <kbd>M</kbd> musiikki päälle/pois</div>
<div id="error"></div>
<div id="touch">
  <div id="dpad" class="pad">
    <div class="up"></div><div class="left"></div><div class="mid"></div><div class="right"></div><div class="down"></div>
  </div>
  <div id="buttons" class="pad">
    <div class="btn" id="btnF" data-key="KeyF">KALA</div>
    <div class="btn" id="btnA" data-key="KeyZ">A</div>
    <div class="btn" id="btnB" data-key="KeyX">B</div>
    <div class="btn" id="btnM" data-key="KeyM">♪</div>
  </div>
</div>
<script src="js/font.js"></script>
<script src="js/core.js"></script>
<script src="js/touch.js"></script>
<script src="js/music.js"></script>
<script src="js/overworld.js"></script>
<script src="js/battle.js"></script>
<script src="js/save.js"></script>
<script src="js/main.js"></script>
<script src="js/admin.js"></script>
<script src="js/inventory.js"></script>
<script src="js/pcscreen.js"></script>
</body>
</html>
